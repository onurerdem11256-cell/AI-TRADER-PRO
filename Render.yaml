services:
  - type: web
    name: ai-trader-pro-binance
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run main.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: DB_PATH
        value: /tmp/ai_trader_binance.db
      - key: ALLOW_LIVE_TRADING
        value: "false"
      - key: BINANCE_FUTURES_BASE_URL
        value: https://fapi.binance.com
